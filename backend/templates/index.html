<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KARM CRED Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <h1>KARM CRED Alternative Scoring Dashboard</h1>
        
        <!-- Search Box for User ID -->
        <div class="search-box" style="margin-bottom: 1.5rem; display: flex; gap: 10px;">
            <input type="text" id="userIdSearch" placeholder="Enter User ID (e.g., GIG0001)" style="padding: 0.75rem; flex: 1; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white;">
            <button onclick="fetchUserData()" style="padding: 0.75rem 1.5rem; background: #38bdf8; color: #0f172a; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">
                Analyze User
            </button>
        </div>

        <div class="content-grid">
            <!-- Control Panel -->
            <div class="control-panel">
                <h2>User Financial Metrics</h2>
                
                <div class="slider-group">
                    <label>Income Volatility: <span id="volatility-val">20%</span></label>
                    <input type="range" id="volatility" min="0" max="1" step="0.01" value="0.2">
                </div>

                <div class="slider-group">
                    <label>Monthly UPI Txns: <span id="upi-val">50</span></label>
                    <input type="range" id="upi" min="0" max="250" step="1" value="50">
                </div>

                <div class="slider-group">
                    <label>Utility Bill Ratio: <span id="utility-val">80%</span></label>
                    <input type="range" id="utility" min="0" max="1" step="0.01" value="0.8">
                </div>

                <div class="score-card">
                    <h3>Predicted Trust Score</h3>
                    <div id="score-display">750</div>
                </div>
            </div>

            <!-- Chart Panel -->
            <div class="chart-panel">
                <h2>Credit Profile Comparison</h2>
                <canvas id="creditRadarChart"></canvas>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
