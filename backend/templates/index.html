<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KARM CRED - TrustScore Simulator</title>
    <link rel="stylesheet" href="../static/css/style.css">
    <!-- Chart.js Library via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <h1>KARM CRED - TrustScore Simulator</h1>
        
        <div class="content-grid">
            <!-- Left Side: Sliders Controls -->
            <div class="control-panel">
                <h2>Simulator Controls</h2>

                <div class="slider-group">
                    <label for="volatility">Income Volatility: <span id="volatility-val">50</span>%</label>
                    <input type="range" id="volatility" min="0" max="100" value="50">
                </div>

                <div class="slider-group">
                    <label for="upi">Monthly UPI Transactions: <span id="upi-val">120</span></label>
                    <input type="range" id="upi" min="0" max="300" value="120">
                </div>

                <div class="slider-group">
                    <label for="utility">Utility On-Time Ratio: <span id="utility-val">85</span>%</label>
                    <input type="range" id="utility" min="0" max="100" value="85">
                </div>

                <div class="score-card">
                    <h3>KARM CRED Score</h3>
                    <div id="score-display">--</div>
                </div>
            </div>

            <!-- Right Side: Dual-View Credit Radar Chart -->
            <div class="chart-panel">
                <h2>Credit Radar Comparison</h2>
                <canvas id="creditRadarChart"></canvas>
            </div>
        </div>
    </div>

    <script src="../static/js/dashboard.js"></script>
</body>
</html>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="style.css">
<script src="dashboard.js"></script>
<link rel="stylesheet" href="../static/css/style.css">
<script src="../static/js/dashboard.js"></script>
